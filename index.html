<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Причина дать Нони Мадуэке Золотой мяч</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#ef0107;--red-d:#b80005;--navy:#063672;--navy-d:#04264f;--gold:#c8a95a;--gold-l:#e8d49a;--bg:#f3f3f1;--ink:#111;--mute:#6b6f78;--line:#e2e2de}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  button,a{-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  .top{background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  .top .in{max-width:1080px;margin:0 auto;padding:9px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .top i{font-style:normal;color:var(--gold-l)}
  .lang{display:flex;gap:8px}
  .lang button{display:block;padding:0;border:2px solid transparent;border-radius:4px;background:none;cursor:pointer;line-height:0;opacity:.65;transition:opacity .15s}
  .lang button:hover{opacity:1}
  .lang button[aria-pressed="true"]{border-color:var(--gold);opacity:1}
  .lang svg{display:block;width:30px;height:20px;border-radius:2px}

  .hero{background:var(--red);color:#fff;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.05) 46px 92px)}
  .hero .in{position:relative;max-width:1080px;margin:0 auto;padding:36px 20px 0;display:grid;grid-template-columns:1fr 340px;gap:30px;align-items:end}
  .kicker{font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--gold-l)}
  h1{font-family:Oswald,'Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;line-height:1.02;margin:12px 0 18px;font-size:clamp(32px,6vw,64px);letter-spacing:-.01em}
  h1 .gold{color:var(--gold-l)}
  .badge{display:inline-flex;align-items:baseline;gap:10px;background:#fff;color:var(--red);padding:8px 18px;border-radius:4px;font-family:Oswald,'Arial Narrow',sans-serif;font-weight:700}
  .badge small{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy)}
  .badge b{font-size:clamp(30px,5vw,48px);line-height:1}
  .date{margin:14px 0 36px;font-weight:600;opacity:.9}
  .heroimg{position:relative;align-self:end}
  .heroimg img{display:block;width:100%;height:auto;border-top-left-radius:6px;border-top-right-radius:6px;box-shadow:0 -6px 40px rgba(0,0,0,.35);border-bottom:6px solid var(--gold)}

  .wrap{max-width:1080px;margin:0 auto;padding:30px 20px 60px}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 8px 30px rgba(6,54,114,.08)}
  .card .bar{background:var(--navy);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
  .tag{white-space:nowrap;background:var(--gold);color:#1a1300;border-radius:3px;padding:3px 9px;font-size:12px}
  .stage{display:flex;justify-content:center;background:#000}
  .frame{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .frame.short{aspect-ratio:9/16;width:auto;height:min(78vh,640px);max-width:100%}
  @supports (height:1svh){.frame.short{height:min(76svh,640px)}}
  .frame iframe,.frame #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
  .fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px;background:var(--navy-d);color:#cfd8e6}
  .fallback.on{display:flex}
  .stage.pm{background:#fff}
  .clipphoto{display:block;width:100%;max-width:560px;height:auto;max-height:620px;object-fit:contain}
  .goat{display:inline-block;margin-top:16px;font-family:Oswald,'Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.28em;color:var(--gold-l);background:var(--navy);border:2px solid var(--gold);padding:11px 22px;border-radius:3px}
  .clipphoto[hidden],.goat[hidden],.btn[hidden]{display:none}
  .info{padding:22px}
  .title{font-family:Oswald,'Arial Narrow',sans-serif;font-weight:700;font-size:clamp(20px,3vw,28px);text-transform:uppercase;line-height:1.1}
  .desc{color:var(--mute);margin-top:6px}
  .btn{display:inline-block;margin-top:16px;background:var(--red);color:#fff;text-decoration:none;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding:12px 20px;border-radius:3px}
  .btn:hover{background:var(--red-d)}
  h2{font-family:Oswald,'Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;font-size:20px;margin:44px 0 14px;display:flex;align-items:center;gap:12px}
  h2::after{content:"";flex:1;height:3px;background:linear-gradient(90deg,var(--red),transparent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .grid button{font:inherit;text-align:left;cursor:pointer;color:var(--ink);background:#fff;border:1px solid var(--line);border-top:4px solid var(--red);border-radius:4px;padding:14px;transition:transform .15s,box-shadow .15s}
  .grid button:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(6,54,114,.15)}
  .grid button.cur{border-top-color:var(--gold);background:#fff8e6}
  .grid b{display:block;font-family:Oswald,'Arial Narrow',sans-serif;font-weight:700;color:var(--red);font-size:22px}
  .grid em{font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
  .grid span{display:block;font-size:13.5px;margin-top:6px;line-height:1.35}
  footer{background:var(--navy-d);color:#aab8cf;font-size:12.5px;line-height:1.6;padding:28px 20px}
  footer div{max-width:1080px;margin:0 auto}

  .glz{margin-top:22px}
  .glz[hidden]{display:none}
  .gbody{padding:22px}
  .gform{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .gform input{flex:1;min-width:180px;font:inherit;font-weight:600;padding:13px 14px;border:2px solid var(--line);border-radius:4px}
  .gform input:focus{outline:none;border-color:var(--navy)}
  .gform .btn{margin-top:0;border:0;cursor:pointer;font-family:inherit}
  .gerr{color:var(--red);font-weight:600;font-size:13.5px;margin-top:10px;min-height:1em}
  .gme{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;margin-bottom:16px}
  .gme b{font-family:Oswald,'Arial Narrow',sans-serif;font-size:24px;text-transform:uppercase}
  .gme span{font-size:13.5px;color:var(--mute)}
  .gme span strong{color:var(--ink)}
  .gme a{margin-left:auto;font-size:12.5px;color:var(--mute);cursor:pointer;text-decoration:underline}
  .gtabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .gtabs button{font:inherit;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;border:2px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;color:var(--ink)}
  .gtabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .glist{list-style:none;margin:0;padding:0}
  .glist li{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
  .glist li:nth-child(-n+3) .r{color:var(--red)}
  .glist li.me{background:#fff8e6}
  .glist .r{font-family:Oswald,'Arial Narrow',sans-serif;font-weight:700;color:var(--mute);font-size:18px}
  .glist .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .glist .v{font-family:Oswald,'Arial Narrow',sans-serif;font-weight:700;font-size:20px;color:var(--navy)}
  .glist .u{font-size:12px;color:var(--mute);font-weight:600;min-width:46px;text-align:right}
  .gempty{color:var(--mute);padding:14px 0}

  .quiz{margin-top:22px}
  .streak{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#1a1300;border-radius:3px;padding:3px 9px;font-size:12px}
  .streak svg{width:11px;height:14px;flex:none}
  .qbody{padding:22px}
  .qmeta{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
  .qtext{font-family:Oswald,'Arial Narrow',sans-serif;font-weight:700;font-size:clamp(20px,3vw,26px);line-height:1.2}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .opt{font:inherit;text-align:left;display:flex;gap:12px;align-items:center;min-height:54px;padding:10px 14px;background:#fff;border:2px solid var(--line);border-radius:4px;cursor:pointer;color:var(--ink);font-weight:600;line-height:1.3}
  .opt i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;display:grid;place-items:center;font-size:13px;font-family:Oswald,'Arial Narrow',sans-serif}
  .opt:hover:not(:disabled){border-color:var(--navy)}
  .opt:disabled{cursor:default}
  .opt.right{border-color:#1a8a4a;background:#e9f7ee}
  .opt.right i{background:#1a8a4a}
  .opt.wrong{border-color:var(--red);background:#fdecec}
  .opt.wrong i{background:var(--red)}
  .opt.dim{opacity:.5}
  .qres{margin-top:16px;padding:14px 16px;border-radius:4px;background:#f6f6f3;border-left:4px solid var(--gold);line-height:1.5;font-size:14.5px}
  .qres[hidden]{display:none}
  .qres b.v{display:block;font-family:Oswald,'Arial Narrow',sans-serif;text-transform:uppercase;font-size:18px;margin-bottom:4px}
  .qres.ok{border-left-color:#1a8a4a}.qres.ok b.v{color:#1a8a4a}
  .qres.bad{border-left-color:var(--red)}.qres.bad b.v{color:var(--red)}
  .qres small{display:block;margin-top:8px;color:var(--mute);font-size:12.5px}
  @media(max-width:760px){.hero .in{grid-template-columns:1fr;padding-top:28px}.heroimg{max-width:300px;margin:0 auto}.date{margin-bottom:24px}}

  @media (orientation:landscape) and (max-height:500px){
    .hero .in{grid-template-columns:1fr 150px;gap:16px;padding:12px 16px 0}
    h1{font-size:clamp(22px,4.2vw,34px);margin:6px 0 10px}
    .badge b{font-size:26px}
    .date{margin:8px 0 12px}
    .frame.short{height:min(78vh,360px)}
  }
  @media(max-width:600px){
    .top .in{padding:6px 14px}
    .top i{letter-spacing:.08em;font-size:11.5px}
    .lang{gap:6px}
    .lang button{padding:2px}
    .lang svg{width:36px;height:24px}
    .hero .in{grid-template-columns:1fr 124px;gap:14px;padding:16px 14px 0;align-items:end}
    .kicker{font-size:11px;letter-spacing:.14em}
    h1{font-size:clamp(23px,7.2vw,30px);margin:8px 0 12px;letter-spacing:0}
    .badge{padding:5px 12px;gap:8px}
    .badge small{font-size:11px}
    .badge b{font-size:28px}
    .date{margin:10px 0 18px;font-size:13px}
    .heroimg{max-width:none;margin:0}
    .heroimg img{border-bottom-width:4px}
    .wrap{padding:16px 12px 40px}
    .card .bar{padding:10px 14px}
    .clipphoto{max-height:460px}
    .info{padding:16px 14px}
    .title{font-size:21px}
    .btn{display:block;text-align:center;padding:15px 14px}
    .goat{display:block;text-align:center;letter-spacing:.2em;padding:14px}
    h2{margin:30px 0 10px;font-size:18px}
    .grid{grid-template-columns:1fr 1fr;gap:8px}
    .grid button{padding:10px}
    .grid b{font-size:19px}
    .grid em{font-size:10.5px}
    .grid span{font-size:12.5px}
    footer{padding:22px 14px}
    .quiz,.glz{margin-top:16px}
    .gbody{padding:16px 14px}
    .gform input{min-width:0;width:100%;flex:none}
    .gform .btn{width:100%}
    .gme a{margin-left:0}
    .gtabs{display:grid;grid-template-columns:1fr 1fr}
    .qbody{padding:16px 14px}
    .opts{grid-template-columns:1fr;gap:8px}
    .opt{min-height:52px}
  }
</style>
</head>
<body>

<div class="top"><div class="in">
  <i>Ballon d'Or watch</i>
  <div class="lang" role="group" aria-label="Language / Язык">
    <button type="button" id="lang-ru" data-lang="ru" aria-label="Русский" title="Русский" aria-pressed="true">
      <svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><rect y="6.67" width="30" height="6.67" fill="#0039a6"/><rect y="13.33" width="30" height="6.67" fill="#d52b1e"/></svg>
    </button>
    <button type="button" id="lang-en" data-lang="en" aria-label="English" title="English" aria-pressed="false">
      <svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><clipPath id="ukS"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="ukT"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#ukS)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukT)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>
    </button>
  </div>
</div></div>

<header class="hero">
  <div class="in">
    <div>
      <div class="kicker" id="kicker"></div>
      <h1 id="h1"></h1>
      <div class="badge"><small id="badgeSmall"></small><b id="no">№1</b></div>
      <div class="date" id="date"></div>

const START = Date.UTC(2026, 10, 23);          // день №1 — 23.11.2026
const MS = 86400000;
const now = new Date();
const today = Math.max(0, Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - START) / MS)); // 0-based
const $ = id => document.getElementById(id);
let player = null, apiReady = false, current = null, curIdx = today;

function initialLang(){
  const h = (location.hash || '').replace('#', '');
  if (h === 'en' || h === 'ru') return h;
  try { const s = localStorage.getItem('lang'); if (s === 'en' || s === 'ru') return s; } catch (e) {}
  return 'ru';
}
let lang = initialLang();
const L = () => I18N[lang];

function clipOf(dayIdx){ return CLIPS[dayIdx % CLIPS.length]; }
const url = c => c.short ? 'https://www.youtube.com/shorts/' + c.id : 'https://www.youtube.com/watch?v=' + c.id;

function texts(c){
  const l = L(), tr = (lang === 'en' && c.en) ? c.en : c;
  return { t: tr.t, d: tr.d,
           type: (l.types[c.type] || c.type) + (c.club ? ' · ' + (l.clubs[c.club] || c.club) : '') };
}

function renderText(idx){
  const l = L(), c = clipOf(idx), x = texts(c);
  $('no').textContent = l.no + (idx + 1);
  $('type').textContent = x.type; $('title').textContent = x.t; $('desc').textContent = x.d;
  $('photo').alt = l.photoAlt;
}

function show(dayIdx){
  curIdx = dayIdx;
  const c = clipOf(dayIdx); current = c;
  renderText(dayIdx);
  const isPhoto = !!c.photo;
  $('stage').classList.toggle('pm', isPhoto);
  $('photo').hidden = !isPhoto; if (isPhoto) $('photo').src = PHOTO;
  $('frame').style.display = isPhoto ? 'none' : '';
  $('open').hidden = isPhoto; $('goat').hidden = !isPhoto;
  document.querySelectorAll('.grid button').forEach((b, i) => b.classList.toggle('cur', i === dayIdx));
  if (isPhoto) { try { if (player && player.pauseVideo) player.pauseVideo(); } catch (e) {} return; }
  $('open').href = url(c); $('fbLink').href = url(c);
  $('frame').classList.toggle('short', !!c.short);
  $('fb').classList.remove('on');
  if (apiReady && player) player.loadVideoById(c.id);
  else if (apiReady) makePlayer(c);
}

function makePlayer(c){
  if (!c.id) return;
  player = new YT.Player('yt', {
    host: 'https://www.youtube-nocookie.com',
    videoId: c.id,
    playerVars: {rel: 0, modestbranding: 1, playsinline: 1},
    events: {onError: () => $('fb').classList.add('on')}
  });
}

function buildGrid(){
  const l = L(), grid = $('grid');

  for (let i = 0; i <= today; i++){
    const x = texts(clipOf(i));
    const b = document.createElement('button');
    const n = document.createElement('b'); n.textContent = l.no + (i + 1);

/* ---------- Вопрос дня + стрик ---------- */
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(n, seed){ const r = mulberry(seed), a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const NQ = QUESTIONS.length;
const dayKey = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / MS);   // номер дня (общий для всех)
const qCycle = Math.floor(dayKey / NQ);
const qIdx = shuffled(NQ, qCycle * 7919 + 12345)[((dayKey % NQ) + NQ) % NQ];                   // «случайный», но один и тот же весь день; без повторов пока не пройден весь банк
const qOrder = shuffled(QUESTIONS[qIdx].ru.o.length, dayKey * 31 + 7);                         // порядок вариантов (одинаков в RU и EN)
const SKEY = 'madueke_quiz_v1';
let qs = {};
try { qs = JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { qs = {}; }
function saveQ(){ try { localStorage.setItem(SKEY, JSON.stringify(qs)); } catch (e) {} }
const effStreak = () => (qs.streak && qs.last >= dayKey - 1) ? qs.streak : 0;     // пропустил день — стрик сгорел
const answeredToday = () => qs.pickDay === dayKey;

function answer(orig){
  if (answeredToday()) return;
  const ok = orig === 0, prev = effStreak();
  qs.streak = ok ? prev + 1 : 0;
  qs.best = Math.max(qs.best || 0, qs.streak);
  qs.last = dayKey; qs.pickDay = dayKey; qs.pick = orig; qs.ok = ok;
  qs.total = (qs.total || 0) + 1; qs.right = (qs.right || 0) + (ok ? 1 : 0);
  saveQ(); renderQuiz();
  if (typeof gSync === 'function' && gs && gs.nick) gSync('visit');
}

function renderQuiz(){
  const l = L(), Q = QUESTIONS[qIdx], q = Q[lang] || Q.ru, done = answeredToday();
  $('qTitle').textContent = l.quiz;
  const st = effStreak();
  $('qStreak').innerHTML = '<svg viewBox="0 0 12 15" aria-hidden="true"><path d="M6 0C6.500 3 10 4.500 10 9a4 4 0 0 1-8 0c0-1.800.800-3 1.800-4C4 6 4.800 6.800 5.500 6.800 5.800 4.500 5.200 2 6 0z" fill="#b80005"/></svg>';
  $('qStreak').append(l.streak + ': ' + st + (qs.best ? ' · ' + l.best + ' ' + qs.best : ''));
  $('qDiff').textContent = l[Q.d] || Q.d;
  $('qHint').textContent = done ? '' : l.quizHint;
  $('qText').textContent = q.q;
  const box = $('qOpts'); box.textContent = '';
  qOrder.forEach((orig, k) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'opt';
    const i = document.createElement('i'); i.textContent = 'ABCD'[k];
    b.append(i, document.createTextNode(q.o[orig]));
    if (done){
      b.disabled = true;
      if (orig === 0) b.classList.add('right');
      else if (orig === qs.pick) b.classList.add('wrong');
      else b.classList.add('dim');
    } else b.onclick = () => answer(orig);
    box.append(b);
  });
  const res = $('qRes');
  res.hidden = !done;
  if (done){
    res.className = 'qres ' + (qs.ok ? 'ok' : 'bad');
    res.textContent = '';
    const v = document.createElement('b'); v.className = 'v'; v.textContent = qs.ok ? l.okT : l.badT;
    res.append(v);
    if (!qs.ok) res.append(l.rightIs + ' ' + q.o[0] + '. ');
    res.append(q.e + ' ');
    const sm = document.createElement('small'); sm.textContent = (qs.ok ? l.okNote(st) : l.badNote) + (Q.s ? '  ' + l.source + ' ' + Q.s : '');
    res.append(sm);
  }
}

/* ---------- Рейтинг Noni Madueke Glazers (бэкенд — Google Apps Script, см. glazers.gs) ---------- */
const GU = "https://script.google.com/macros/s/AKfycbydWJNcLBR1l4tYqEbMIsi7cvspcIJW58P0NdRW4IQSZXylEsSvlXNxhMHNtSG-Wjbv/exec";
const GKEY = 'madueke_glazers_v1';
let gs = {};
try { gs = JSON.parse(localStorage.getItem(GKEY)) || {}; } catch (e) { gs = {}; }
const gSave = () => { try { localStorage.setItem(GKEY, JSON.stringify(gs)); } catch (e) {} };
let gData = null, gTab = 'v', gErrKey = '', gBusy = false;
const gOn = () => /^https:\/\//.test(GU);

function gToken(){
  const a = new Uint8Array(16);
  (window.crypto || window.msCrypto).getRandomValues(a);
  return Array.from(a, x => x.toString(16).padStart(2, '0')).join('');
}
function gCall(params){
  return fetch(GU + (GU.includes('?') ? '&' : '?') + new URLSearchParams(params)).then(r => r.json());
}
let gAgain = false;
async function gSync(action){
  if (!gOn()) return;
  if (gBusy) { gAgain = true; return; }
  gBusy = true;
  try {
    const p = {action: action, day: dayKey};
    if (action === 'visit') { p.nick = gs.nick; p.token = gs.token; }
    let r = await gCall(p);
    // ответ на квиз за сегодня ещё не отправлен — отправляем (после входа или сразу после ответа)
    if (r && r.ok && action === 'visit' && answeredToday() && gs.qrep !== dayKey) {
      const r2 = await gCall({action: 'quiz', nick: gs.nick, token: gs.token, ok: qs.ok ? '1' : '0', day: dayKey});
      if (r2 && r2.ok) { gs.qrep = dayKey; gSave(); r = r2; }
    }
    if (r && r.ok) { gData = r; gErrKey = ''; }
    else {
      gErrKey = (r && r.error) || 'server';
      if (action === 'visit' && (gErrKey === 'taken' || gErrKey === 'bad_nick')) { gs = {}; gSave(); }
    }
  } catch (e) { gErrKey = 'net'; }
  gBusy = false;
  renderGlz();
  if (gAgain) { gAgain = false; gSync(gs.nick ? 'visit' : 'top'); }
}
function gJoin(nick){
  nick = nick.trim().replace(/\s+/g, ' ');
  if (!/^[\p{L}\p{N}_\-. ]{2,20}$/u.test(nick)) { gErrKey = 'bad_nick'; renderGlz(); return; }
  gs = {nick: nick, token: gToken()}; gSave();
  gSync('visit');
}

function renderGlz(){
  const box = $('glz');
  if (!gOn()) { box.hidden = true; return; }
  box.hidden = false;
  const l = L(), joined = !!gs.nick;
  $('gTitle').textContent = l.glz;
  $('gTotal').textContent = gData ? l.members(gData.total) : '';
  $('gTotal').hidden = !gData;
  $('gIntro').textContent = l.glzIntro;
  $('gNick').placeholder = l.nickPh; $('gNick').setAttribute('aria-label', l.nickPh);
  $('gGo').textContent = l.join;
  $('gJoin').hidden = joined;
  $('gErr').textContent = gErrKey ? (l.gErr[gErrKey] || l.gErr.server) : '';

  const me = $('gMe');
  me.hidden = !(joined && gData && gData.me);
  if (!me.hidden){
    const m = gData.me; me.textContent = '';
    const w = document.createElement('div'); w.className = 'gme';
    const nm = document.createElement('b'); nm.textContent = m.n;
    const sp = (label, val) => { const x = document.createElement('span'); x.append(label + ' '); const st = document.createElement('strong'); st.textContent = val; x.append(st); return x; };
    const lk = document.createElement('a'); lk.textContent = l.leave;
    lk.onclick = () => { gs = {}; gSave(); gErrKey = ''; renderGlz(); };
    w.append(nm, sp(l.visits + ':', m.v), sp(l.streak + ':', m.s + ' ' + l.inRow), sp(l.bestS + ':', m.b), sp(l.place + ':', (rk => rk ? '#' + rk : '—')(({v: m.rankV, s: m.rankS, q: m.rankQR, qs: m.rankQS})[gTab])), lk);
    me.append(w);
    if (m.qt) { const qd = document.createElement('div'); qd.className = 'gme'; qd.append(sp(l.quizYou + ':', l.rightOf(m.qr, m.qt)), sp(l.streak + ':', m.qs + ' ' + l.inRow), sp(l.bestS + ':', m.qb)); me.append(qd); }
  }

  const board = $('gBoard'); board.hidden = !gData;
  if (!gData) return;
  [['gtV','tabV','v'],['gtS','tabS','s'],['gtQ','tabQ','q'],['gtQS','tabQS','qs']].forEach(([id, k, t]) => { $(id).textContent = l[k]; $(id).setAttribute('aria-pressed', String(gTab === t)); });
  const list = ({v: gData.byVisits, s: gData.byStreak, q: gData.quizRight, qs: gData.quizStreak})[gTab] || [], ul = $('gList');
  ul.textContent = '';
  if (!list.length){ const e = document.createElement('div'); e.className = 'gempty'; e.textContent = (gTab === 'q' || gTab === 'qs') ? l.noQuiz : l.empty; ul.append(e); return; }
  const mine = joined ? gs.nick.toLowerCase() : null;
  list.forEach((x, i) => {
    const li = document.createElement('li'); if (x.n.toLowerCase() === mine) li.className = 'me';
    const r = document.createElement('span'); r.className = 'r'; r.textContent = i + 1;
    const n = document.createElement('span'); n.className = 'n'; n.textContent = x.n;
    const v = document.createElement('span'); v.className = 'v'; v.textContent = ({v: x.v, s: x.s, q: x.qr, qs: x.qs})[gTab];
    const u = document.createElement('span'); u.className = 'u'; u.textContent = gTab === 'q' ? l.unitQ + ' / ' + x.qt : (gTab === 'v' ? l.unitV : l.unitS);
    li.append(r, n, v, u); ul.append(li);
  });
}

  document.documentElement.lang = lang;
  document.title = l.title;
  $('kicker').textContent = l.kicker;
  $('h1').innerHTML = l.h1;
  $('badgeSmall').textContent = l.reason;
  $('barTitle').textContent = l.moment;
  $('noPlayer').textContent = l.noPlayer;
  $('fbLink').textContent = l.watch;
  $('open').textContent = l.open;
  $('allTitle').textContent = l.all;
  $('footTxt').textContent = l.footer;
  $('heroImg').alt = l.heroAlt;
  $('date').textContent = now.toLocaleDateString(l.locale, {day:'numeric', month:'long', weekday:'long'});
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  buildGrid();
  renderText(curIdx);
  renderQuiz();
  renderGlz();
}

function setLang(code){
  lang = code;
  try { localStorage.setItem('lang', code); } catch (e) {}
  try { history.replaceState(null, '', '#' + code); } catch (e) {}
  applyLang();
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if ((h === 'en' || h === 'ru') && h !== lang) { lang = h; applyLang(); } });

// YouTube IFrame API
window.onYouTubeIframeAPIReady = () => { apiReady = true; if (current && current.id) makePlayer(current); };
const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.append(sc);
setTimeout(() => { if (!apiReady) $('fb').classList.add('on'); }, 5000); // если API не загрузилось

applyLang();
show(today);
if (gOn()) gSync(gs.nick ? 'visit' : 'top');
</script>
</body>
